name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build module package
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/module.zip HEAD
          cp module.json dist/module.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/module.zip dist/module.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Journal Effects Links $GITHUB_REF_NAME" \
            --generate-notes
